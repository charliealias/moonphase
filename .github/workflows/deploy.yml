name: Build Wasm & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run Rust unit tests
        run: cargo test

      - name: Compile Rust to WebAssembly
        run: wasm-pack build --release --target web --out-dir dist/pkg

      - name: Stamp Service Worker cache version
        run: |
          if [ -f dist/sw.js ]; then
            sed -i "s/__BUILD_VERSION__/${GITHUB_SHA::7}/g" dist/sw.js
          fi

      - name: Verify dist contents
        run: ls -la dist && ls -la dist/pkg

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4