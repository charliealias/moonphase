<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MoonPhase</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; color: var(--text); }
    h2 { font-size: 0.95rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .ios-hint {
      display: none;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: #e0f2fe;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .phase-badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .countdown { font-size: 2rem; font-weight: 800; margin: 4px 0; }
    .sub-dates { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .care-tip {
      background: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #e2e8f0;
    }
    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }
    input, select {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    button.secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
    }
    button.danger {
      background: transparent;
      color: var(--danger);
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    #installBtn { display: none; font-size: 0.8rem; padding: 6px 12px; }
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions-row button { flex: 1; }
    ul { list-style: none; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    .item-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MoonPhase</h1>
    <button id="installBtn">Install App</button>
  </header>

  <div id="iosInstallHint" class="ios-hint">
    To install on iPhone: tap <strong>Share</strong> in Safari, then choose <strong>"Add to Home Screen"</strong> so offline data stays saved.
  </div>

  <!-- Status & Partner Care Card -->
  <section class="card">
    <div id="phaseBadge" class="phase-badge">Loading...</div>
    <div id="predDays" class="countdown">--</div>
    <div id="predDetail" class="sub-dates">Initializing engine...</div>
    <div id="careTipText" class="care-tip"></div>

    <div class="actions-row">
      <button id="exportIcsBtn">Export / Share .ics</button>
      <button id="importIcsBtn" class="secondary">Restore from .ics</button>
      <input type="file" id="icsFileInput" accept=".ics,text/calendar" hidden />
    </div>
  </section>

  <!-- Add Record Form -->
  <section class="card">
    <h2>Log Start Date</h2>
    <form id="addForm" class="form-grid">
      <div class="row">
        <input type="date" id="dateInput" required />
        <select id="flowInput">
          <option value="Normal">Flow: Normal</option>
          <option value="Heavy">Flow: Heavy</option>
          <option value="Light">Flow: Light</option>
        </select>
      </div>
      <input type="text" id="notesInput" placeholder="Notes (e.g., cramps, cravings, meds)" />
      <button type="submit">Save Entry</button>
    </form>
  </section>

  <!-- History List -->
  <section class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h2 style="margin:0;">History</h2>
      <span id="avgCycleBadge" class="pill">Avg: 28d</span>
    </div>
    <ul id="recordList"></ul>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
