<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MoonPhase</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; color: var(--text); }
    h2 { font-size: 0.95rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .ios-hint {
      display: none;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: #e0f2fe;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .phase-badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .countdown { font-size: 1.85rem; font-weight: 800; margin: 4px 0; }
    .sub-dates { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .care-tip {
      background: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #e2e8f0;
    }
    /* Calendar Grid */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-nav { display: flex; gap: 6px; align-items: center; }
    .cal-nav button { padding: 4px 10px; font-size: 0.85rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .cal-title { font-weight: 700; font-size: 0.95rem; min-width: 110px; text-align: center; }
    .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-weekdays span { font-size: 0.75rem; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .cal-cell.empty { cursor: default; }
    .cal-cell.logged { background: rgba(244, 63, 94, 0.28); color: #fda4af; border-color: rgba(244, 63, 94, 0.5); font-weight: 700; }
    .cal-cell.predicted { background: rgba(244, 63, 94, 0.12); color: #fecdd3; border: 1px dashed #fb7185; }
    .cal-cell.pms { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border-color: rgba(245, 158, 11, 0.35); }
    .cal-cell.ovulation { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
    .cal-cell.today { box-shadow: 0 0 0 2px var(--accent); font-weight: 800; }
    .cal-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 0.75rem; color: var(--muted); justify-content: center; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    /* Forms & Lists */
    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }
    input, select {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    button.secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
    }
    button.danger {
      background: transparent;
      color: var(--danger);
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    #installBtn { display: none; font-size: 0.8rem; padding: 6px 12px; }
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions-row button { flex: 1; }
    ul { list-style: none; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    .item-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MoonPhase</h1>
    <button id="installBtn">安裝 App</button>
  </header>

  <div id="iosInstallHint" class="ios-hint">
    iPhone 安裝提示：點擊 Safari 底部的 <strong>分享</strong> 圖示，選擇 <strong>「加入主畫面」</strong> 並從桌面開啟，即可永久保存離線資料。
  </div>

  <!-- 狀態與照護看板 -->
  <section class="card">
    <div id="phaseBadge" class="phase-badge">載入中...</div>
    <div id="predDays" class="countdown">--</div>
    <div id="predDetail" class="sub-dates">正在初始化引擎...</div>
    <div id="careTipText" class="care-tip"></div>

    <div class="actions-row">
      <button id="exportIcsBtn">匯出 / 分享 .ics</button>
      <button id="importIcsBtn" class="secondary">從 .ics 還原</button>
      <input type="file" id="icsFileInput" accept=".ics,text/calendar" hidden />
    </div>
  </section>

  <!-- 月曆檢視 -->
  <section class="card">
    <div class="cal-header">
      <h2 style="margin:0;">週期月曆</h2>
      <div class="cal-nav">
        <button id="prevMonthBtn" type="button">&lsaquo;</button>
        <span id="calMonthTitle" class="cal-title">--</span>
        <button id="nextMonthBtn" type="button">&rsaquo;</button>
      </div>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div id="calendarGrid" class="cal-grid"></div>
    <div class="cal-legend">
      <span><i class="legend-dot" style="background:#fb7185;"></i>已記錄</span>
      <span><i class="legend-dot" style="border:1px dashed #fb7185;"></i>預計經期</span>
      <span><i class="legend-dot" style="background:#fbbf24;"></i>PMS 觀察</span>
      <span><i class="legend-dot" style="background:#38bdf8;"></i>排卵期</span>
    </div>
  </section>

  <!-- 新增紀錄 -->
  <section class="card">
    <h2>記錄經期開始日</h2>
    <form id="addForm" class="form-grid">
      <div class="row">
        <input type="date" id="dateInput" required />
        <select id="flowInput">
          <option value="正常">經血量：正常</option>
          <option value="偏多">經血量：偏多</option>
          <option value="偏少">經血量：偏少</option>
        </select>
      </div>
      <input type="text" id="notesInput" placeholder="備註（例如：經痛程度、想吃的食物、止痛藥）" />
      <button type="submit">儲存紀錄</button>
    </form>
  </section>

  <!-- 歷史紀錄 -->
  <section class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h2 style="margin:0;">歷史紀錄</h2>
      <span id="avgCycleBadge" class="pill">平均：28 天</span>
    </div>
    <ul id="recordList"></ul>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
