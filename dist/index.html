<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MoonPhase</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(23, 30, 46, 0.78);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #7dd3fc;
      --accent-glow: rgba(56, 189, 248, 0.16);
      --rose-bg: rgba(251, 113, 133, 0.18);
      --amber-bg: rgba(251, 191, 36, 0.15);
      --danger: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "PingFang TC", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #17233b 0%, var(--bg) 55%);
      background-color: var(--bg);
      color: var(--text);
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-pill-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.76rem;
      font-weight: 500;
      box-shadow: none;
      white-space: nowrap;
    }

    .icon-pill-btn.primary-pill {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: rgba(125, 211, 252, 0.3);
      font-weight: 600;
    }

    #installBtn {
      display: none;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      font-weight: 600;
    }

    h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .unified-card {
      background: linear-gradient(165deg, rgba(30, 41, 66, 0.85) 0%, rgba(17, 23, 37, 0.92) 100%);
      border: 1px solid var(--border-strong);
    }

    .card-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .ios-hint {
      display: none;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #bae6fd;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.8rem;
      margin-bottom: 14px;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(125, 211, 252, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .countdown {
      display: block;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.2;
    }

    .sub-dates {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin: 4px 0 12px;
    }

    .care-tip {
      background: rgba(9, 13, 22, 0.52);
      border: 1px solid var(--border);
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 0.86rem;
      color: #cbd5e1;
      line-height: 1.55;
    }

    /* 月曆導覽列（含「今天」按鈕） */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 6px;
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .today-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      box-shadow: none;
    }

    .cal-nav {
      display: flex;
      gap: 2px;
      align-items: center;
      background: rgba(9, 13, 22, 0.5);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .cal-nav button {
      padding: 3px 9px;
      font-size: 0.9rem;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      font-weight: 600;
      box-shadow: none;
    }

    .cal-title {
      font-weight: 600;
      font-size: 0.84rem;
      min-width: 86px;
      text-align: center;
      color: var(--text);
    }

    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .cal-weekdays span {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
      padding-bottom: 4px;
    }

    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.84rem;
      font-weight: 500;
      color: #cbd5e1;
      cursor: pointer;
    }

    .cal-cell.empty { cursor: default; }

    .cal-cell.logged {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35);
    }

    .cal-cell.predicted {
      background: var(--rose-bg);
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.35);
    }

    .cal-cell.pms {
      background: var(--amber-bg);
      color: #fcd34d;
    }

    .cal-cell.ovulation {
      background: var(--accent-glow);
      color: var(--accent);
    }

    .cal-cell.today {
      outline: 2px solid #ffffff;
      outline-offset: -2px;
      font-weight: 700;
      color: #ffffff;
    }

    .cal-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 0.73rem;
      color: var(--muted);
      justify-content: center;
    }

    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* 原生 <details> 歷史摺疊抽屜 */
    details.history-drawer summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    details.history-drawer summary::-webkit-details-marker { display: none; }

    .drawer-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
    }

    .drawer-chevron {
      display: inline-block;
      font-size: 0.72rem;
      transition: transform 0.2s ease;
    }

    details.history-drawer[open] .drawer-chevron {
      transform: rotate(90deg);
      color: var(--accent);
    }

    details.history-drawer[open] summary {
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* 表單與純 CSS 原生 Checkbox 膠囊標籤 */
    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }

    input, select {
      flex: 1;
      min-width: 0;
      background: rgba(9, 13, 22, 0.65);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    fieldset.chip-group {
      border: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    label.chip {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    label.chip input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* 純 CSS 控制勾選高亮，無需 JS */
    label.chip:has(input:checked) {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: rgba(125, 211, 252, 0.45);
      font-weight: 600;
    }

    button {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }

    button:active { opacity: 0.88; transform: scale(0.98); }

    button.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: transparent;
      color: var(--danger);
      box-shadow: none;
      padding: 4px 6px;
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.85;
    }

    ul { list-style: none; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    li:last-child { border-bottom: none; padding-bottom: 0; }

    .item-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      margin-left: 5px;
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .mini-select {
      flex: none;
      width: auto;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* 原生 HTML5 <dialog> 模態視窗 */
    dialog {
      margin: auto;
      background: #151c2c;
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 20px;
      max-width: 340px;
      width: calc(100% - 32px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    dialog::backdrop {
      background: rgba(9, 13, 22, 0.72);
      backdrop-filter: blur(4px);
    }

    .dialog-msg {
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 16px;
      color: #e2e8f0;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .dialog-actions button {
      padding: 8px 14px;
      font-size: 0.84rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>MoonPhase</h1>
    <div class="header-actions">
      <button id="installBtn" class="icon-pill-btn">安裝</button>
      <button id="exportIcsBtn" class="icon-pill-btn primary-pill">匯出 .ics</button>
      <button id="importIcsBtn" class="icon-pill-btn">還原</button>
      <input type="file" id="icsFileInput" accept=".ics,text/calendar" hidden />
    </div>
  </header>

  <div id="iosInstallHint" class="ios-hint">
    iPhone 安裝提示：點擊 Safari 底部的 <strong>分享</strong> 圖示，選擇 <strong>「加入主畫面」</strong> 並從桌面開啟，即可永久保存離線資料。
  </div>

  <!-- 一體化主看板 -->
  <section class="card unified-card">
    <output id="phaseBadge" class="phase-badge">載入中...</output>
    <output id="predDays" class="countdown">--</output>
    <output id="predDetail" class="sub-dates">正在初始化引擎...</output>
    <div id="careTipText" class="care-tip"></div>

    <div class="card-divider"></div>

    <!-- 週期月曆（含「今天」快速按鈕） -->
    <div class="cal-header">
      <h2 style="margin:0;">週期月曆</h2>
      <div class="cal-controls">
        <button id="todayBtn" type="button" class="today-btn">今天</button>
        <div class="cal-nav">
          <button id="prevMonthBtn" type="button" aria-label="上個月">&lsaquo;</button>
          <span id="calMonthTitle" class="cal-title">--</span>
          <button id="nextMonthBtn" type="button" aria-label="下個月">&rsaquo;</button>
        </div>
      </div>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div id="calendarGrid" class="cal-grid"></div>
    <div class="cal-legend">
      <span><i class="legend-dot" style="background:#f43f5e;"></i>已記錄</span>
      <span><i class="legend-dot" style="background:rgba(251,113,133,0.45);"></i>預計經期</span>
      <span><i class="legend-dot" style="background:#fbbf24;"></i>PMS 觀察</span>
      <span><i class="legend-dot" style="background:#7dd3fc;"></i>排卵期</span>
    </div>

    <div class="card-divider"></div>

    <!-- 原生 <details> 歷史紀錄摺疊抽屜 -->
    <details id="historyDrawer" class="history-drawer">
      <summary>
        <span class="drawer-title">
          <span class="drawer-chevron">&#9654;</span>
          歷史紀錄 <span id="historyCount" style="font-weight:400; opacity:0.75;">(0)</span>
        </span>
        <span id="avgCycleBadge" class="pill" style="margin:0;">週期 28d ｜ 經期 5d</span>
      </summary>
      <ul id="recordList"></ul>
    </details>
  </section>

  <!-- 快速新增紀錄表單 -->
  <section class="card">
    <h2>記錄經期開始日</h2>
    <form id="addForm" class="form-grid">
      <input type="date" id="dateInput" name="date" required />
      <div class="row">
        <select id="flowInput" name="flow">
          <option value="正常">經血量：正常</option>
          <option value="偏多">經血量：偏多</option>
          <option value="偏少">經血量：偏少</option>
        </select>
        <select id="durationInput" name="duration">
          <option value="">天數：進行中 (預估)</option>
          <option value="3">持續 3 天</option>
          <option value="4">持續 4 天</option>
          <option value="5">持續 5 天</option>
          <option value="6">持續 6 天</option>
          <option value="7">持續 7 天</option>
          <option value="8">持續 8 天</option>
        </select>
      </div>

      <!-- 原生 Checkbox 膠囊標籤（純 CSS 狀態管理） -->
      <fieldset id="symptomChips" class="chip-group">
        <label class="chip"><input type="checkbox" name="symptom" value="經痛" />經痛</label>
        <label class="chip"><input type="checkbox" name="symptom" value="腰痠" />腰痠</label>
        <label class="chip"><input type="checkbox" name="symptom" value="嗜甜" />嗜甜</label>
        <label class="chip"><input type="checkbox" name="symptom" value="疲倦" />疲倦</label>
        <label class="chip"><input type="checkbox" name="symptom" value="水腫" />水腫</label>
        <label class="chip"><input type="checkbox" name="symptom" value="情緒敏感" />情緒敏感</label>
        <label class="chip"><input type="checkbox" name="symptom" value="頭痛" />頭痛</label>
        <label class="chip"><input type="checkbox" name="symptom" value="止痛藥" />止痛藥</label>
      </fieldset>

      <input type="text" id="notesInput" name="notes" placeholder="補充其他備註（選填）..." />
      <button type="submit">儲存紀錄</button>
    </form>
  </section>

  <!-- 原生 HTML5 提示 / 確認視窗（取代系統 alert / confirm） -->
  <dialog id="appDialog">
    <p id="dialogMessage" class="dialog-msg"></p>
    <div class="dialog-actions">
      <button id="dialogCancelBtn" type="button" class="secondary">取消</button>
      <button id="dialogConfirmBtn" type="button">確定</button>
    </div>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
