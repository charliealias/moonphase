<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MoonPhase</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(23, 30, 46, 0.78);
      --card-solid: #151c2c;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #7dd3fc;
      --accent-glow: rgba(56, 189, 248, 0.16);
      --rose: #fb7185;
      --rose-bg: rgba(251, 113, 133, 0.18);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.15);
      --danger: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "PingFang TC", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #17233b 0%, var(--bg) 55%);
      background-color: var(--bg);
      color: var(--text);
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* 主狀態卡片專屬微光層次 */
    .hero-card {
      background: linear-gradient(160deg, rgba(30, 41, 66, 0.85) 0%, rgba(18, 24, 38, 0.9) 100%);
      border: 1px solid var(--border-strong);
      position: relative;
      overflow: hidden;
    }

    .ios-hint {
      display: none;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #bae6fd;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.82rem;
      margin-bottom: 14px;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(125, 211, 252, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .countdown {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin: 2px 0 4px;
    }

    .sub-dates {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .care-tip {
      background: rgba(9, 13, 22, 0.55);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* 月曆網格精緻化 */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .cal-nav {
      display: flex;
      gap: 4px;
      align-items: center;
      background: rgba(9, 13, 22, 0.5);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .cal-nav button {
      padding: 4px 10px;
      font-size: 0.9rem;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      font-weight: 600;
    }

    .cal-nav button:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .cal-title {
      font-weight: 600;
      font-size: 0.88rem;
      min-width: 96px;
      text-align: center;
      color: var(--text);
    }

    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .cal-weekdays span {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
      padding-bottom: 6px;
    }

    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.84rem;
      font-weight: 500;
      color: #cbd5e1;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .cal-cell:not(.empty):active {
      transform: scale(0.9);
    }

    .cal-cell.empty { cursor: default; }

    .cal-cell.logged {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35);
    }

    .cal-cell.predicted {
      background: var(--rose-bg);
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.35);
    }

    .cal-cell.pms {
      background: var(--amber-bg);
      color: #fcd34d;
    }

    .cal-cell.ovulation {
      background: var(--accent-glow);
      color: var(--accent);
    }

    .cal-cell.today {
      outline: 2px solid #ffffff;
      outline-offset: -2px;
      font-weight: 700;
      color: #ffffff;
    }

    .cal-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.74rem;
      color: var(--muted);
      justify-content: center;
    }

    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* 表單與按鈕 */
    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }

    input, select {
      flex: 1;
      background: rgba(9, 13, 22, 0.65);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button:active {
      opacity: 0.88;
      transform: scale(0.98);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
      font-weight: 500;
      font-size: 0.84rem;
    }

    button.danger {
      background: transparent;
      color: var(--danger);
      box-shadow: none;
      padding: 4px 8px;
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.8;
    }

    #installBtn {
      display: none;
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .actions-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .actions-row button { flex: 1; }

    ul { list-style: none; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    li:last-child { border-bottom: none; padding-bottom: 2px; }

    .item-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.73rem;
      margin-left: 6px;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 500;
      box-shadow: none;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: rgba(125, 211, 252, 0.45);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>MoonPhase</h1>
    <button id="installBtn">安裝 App</button>
  </header>

  <div id="iosInstallHint" class="ios-hint">
    iPhone 安裝提示：點擊 Safari 底部的 <strong>分享</strong> 圖示，選擇 <strong>「加入主畫面」</strong> 並從桌面開啟，即可永久保存離線資料。
  </div>

  <!-- 狀態與照護看板 -->
  <section class="card hero-card">
    <div id="phaseBadge" class="phase-badge">載入中...</div>
    <div id="predDays" class="countdown">--</div>
    <div id="predDetail" class="sub-dates">正在初始化引擎...</div>
    <div id="careTipText" class="care-tip"></div>

    <div class="actions-row">
      <button id="exportIcsBtn">匯出 / 分享 .ics</button>
      <button id="importIcsBtn" class="secondary">從 .ics 還原</button>
      <input type="file" id="icsFileInput" accept=".ics,text/calendar" hidden />
    </div>
  </section>

  <!-- 月曆檢視 -->
  <section class="card">
    <div class="cal-header">
      <h2 style="margin:0;">週期月曆</h2>
      <div class="cal-nav">
        <button id="prevMonthBtn" type="button">&lsaquo;</button>
        <span id="calMonthTitle" class="cal-title">--</span>
        <button id="nextMonthBtn" type="button">&rsaquo;</button>
      </div>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div id="calendarGrid" class="cal-grid"></div>
    <div class="cal-legend">
      <span><i class="legend-dot" style="background:#f43f5e;"></i>已記錄</span>
      <span><i class="legend-dot" style="background:rgba(251,113,133,0.45);"></i>預計經期</span>
      <span><i class="legend-dot" style="background:#fbbf24;"></i>PMS 觀察</span>
      <span><i class="legend-dot" style="background:#7dd3fc;"></i>排卵期</span>
    </div>
  </section>

  <!-- 新增紀錄 -->
  <section class="card">
    <h2>記錄經期開始日</h2>
    <form id="addForm" class="form-grid">
      <div class="row">
        <input type="date" id="dateInput" required />
        <select id="flowInput">
          <option value="正常">經血量：正常</option>
          <option value="偏多">經血量：偏多</option>
          <option value="偏少">經血量：偏少</option>
        </select>
      </div>

      <!-- 快速症狀標籤（type="button" 避免誤觸送出表單） -->
      <div id="symptomChips" class="chip-group">
        <button type="button" class="chip" data-tag="經痛">經痛</button>
        <button type="button" class="chip" data-tag="腰痠">腰痠</button>
        <button type="button" class="chip" data-tag="嗜甜">嗜甜</button>
        <button type="button" class="chip" data-tag="疲倦">疲倦</button>
        <button type="button" class="chip" data-tag="水腫">水腫</button>
        <button type="button" class="chip" data-tag="情緒敏感">情緒敏感</button>
        <button type="button" class="chip" data-tag="頭痛">頭痛</button>
        <button type="button" class="chip" data-tag="止痛藥">止痛藥</button>
      </div>

      <input type="text" id="notesInput" placeholder="點選上方標籤或自行輸入備註..." />
      <button type="submit">儲存紀錄</button>
    </form>
  </section>

  <!-- 歷史紀錄 -->
  <section class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <h2 style="margin:0;">歷史紀錄</h2>
      <span id="avgCycleBadge" class="pill">平均：28 天</span>
    </div>
    <ul id="recordList"></ul>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
